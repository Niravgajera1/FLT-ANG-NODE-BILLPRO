<div class="p-6">
  <div class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h1 class="text-3xl font-semibold text-slate-900">{{ pageTitle }}</h1>
      <p class="mt-2 text-sm text-slate-500">Enter product details and save to return to the product list.</p>
    </div>
    <button routerLink="/products" class="inline-flex items-center rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50">
      Back to Product List
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-8 rounded-[2rem] border border-gray-200 bg-white p-8 shadow-xl shadow-slate-200/40">
    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Product information</p>
      </div>
      <div class="grid gap-6 md:grid-cols-2">
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Product Name</span>
          <input formControlName="name" type="text" placeholder="Enter product name" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">SKU</span>
          <input formControlName="sku" type="text" placeholder="Product SKU" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Category</span>
          <input formControlName="category" type="text" placeholder="Category" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Price</span>
          <input formControlName="price" type="text" placeholder="$0.00" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
      </div>
    </div>

    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Inventory details</p>
      </div>
      <div class="grid gap-6 md:grid-cols-2">
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Stock</span>
          <input formControlName="stock" type="number" min="0" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Supplier</span>
          <input formControlName="supplier" type="text" placeholder="Supplier name" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3 md:col-span-2">
          <span class="text-sm font-medium text-slate-700">Status</span>
          <select formControlName="status" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100">
            <option value="In stock">In stock</option>
            <option value="Low stock">Low stock</option>
            <option value="Out of stock">Out of stock</option>
          </select>
        </label>
      </div>
    </div>

    <div class="flex flex-col gap-3 border-t border-gray-200 pt-4 sm:flex-row sm:justify-end">
      <button type="button" (click)="cancel()" class="rounded-2xl border border-gray-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
        Cancel
      </button>
      <button type="submit" class="rounded-2xl bg-primary-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-primary-200/30 transition hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60" [disabled]="form.invalid">
        {{ submitText }}
      </button>
    </div>
  </form>
</div>
