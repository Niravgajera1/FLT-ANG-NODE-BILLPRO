<header class="bg-white border-b border-gray-200 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl flex items-center justify-center shadow-sm overflow-hidden bg-transparent">
        <img src="./assets/logo_icon-removebg.png" alt="BillCube" class="w-9 h-9 object-contain" />
      </div>
      <div>
        <span class="text-lg font-extrabold text-gray-900 tracking-tight">BillCube</span>
        <span class="hidden sm:inline text-xs text-gray-400 font-medium ml-2">ERP Suite</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button class="relative p-2 rounded-xl text-gray-500 hover:bg-gray-100 hover:text-gray-700 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>

      <div class="flex items-center gap-2.5 pl-3 border-l border-gray-200">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary-400 to-primary-600 flex items-center justify-center text-white text-sm font-bold">
          {{ auth.currentUser()?.name?.charAt(0) ?? 'A' }}
        </div>
        <div class="hidden sm:block">
          <p class="text-sm font-semibold text-gray-800 leading-tight">{{ auth.currentUser()?.name }}</p>
          <p class="text-xs text-gray-400 leading-tight">{{ auth.currentUser()?.role }}</p>
        </div>
      </div>

      <button
        (click)="logout()"
        class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-semibold text-red-500 hover:bg-red-50 hover:text-red-600 transition-all duration-150 focus:outline-none"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
        </svg>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </div>
  </div>
</header>
