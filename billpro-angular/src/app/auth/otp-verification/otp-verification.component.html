<div class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-slate-100 flex items-center justify-center p-4 relative overflow-hidden">
  <div class="absolute top-0 left-0 w-[560px] h-[560px] bg-primary-100 rounded-full -translate-x-1/2 -translate-y-1/2 opacity-40 blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-0 right-0 w-[420px] h-[420px] bg-blue-200 rounded-full translate-x-1/2 translate-y-1/2 opacity-30 blur-3xl pointer-events-none"></div>
  <div class="relative w-full max-w-md">
    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-card border border-gray-100/80">
      <div class="flex flex-col items-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-btn mb-4">
          <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
              d="M12 11V5m0 0L8 9m4-4l4 4M4 16a8 8 0 0016 0"/>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">Verify your account</h1>
        <p class="text-sm text-gray-500 mt-1 font-medium text-center">
          Enter the 6-digit code we sent to your email or phone to complete signup.
        </p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="space-y-5">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1.5">OTP Code</label>
          <input type="tel" formControlName="otp" inputmode="numeric" maxlength="6" pattern="[0-9]*" placeholder="123456" class="input-field w-full text-center tracking-[0.35em] text-lg font-semibold" [class.error]="otpCtrl.touched && otpCtrl.invalid" (input)="onOtpInput($event)" />
          @if (otpCtrl.touched && otpCtrl.errors) {
            <p class="mt-1.5 text-xs text-red-500">Enter the 6-digit code sent to your email or phone.</p>
          }
        </div>

        <button type="submit" class="btn-primary w-full">Verify code</button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-500">
        <p>Didn’t receive a code?</p>
        <button type="button" (click)="resendOtp()" class="text-primary-600 font-semibold hover:text-primary-800 mt-2 inline-block">Resend OTP</button>
      </div>

      <div class="mt-6 text-center text-sm text-gray-400">
        <button type="button" (click)="cancel()" class="underline hover:text-gray-600">Cancel and go back</button>
      </div>
    </div>
  </div>
</div>
