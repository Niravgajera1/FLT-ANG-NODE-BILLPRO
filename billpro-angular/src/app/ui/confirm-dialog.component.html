<div *ngIf="confirm.state().open" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 px-4 py-6">
  <div class="w-full max-w-md overflow-hidden rounded-3xl border border-slate-200 bg-white p-6 shadow-2xl shadow-slate-950/10">
    <div class="text-sm font-semibold uppercase tracking-[0.16em] text-slate-500">{{ confirm.state().title }}</div>
    <p class="mt-4 text-base leading-7 text-slate-900">{{ confirm.state().message }}</p>
    <div class="mt-6 flex justify-end gap-3">
      <button type="button"
              class="rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-50"
              (click)="cancelAction()">
        {{ confirm.state().cancelText }}
      </button>
      <button type="button"
              class="rounded-full bg-primary-700 px-4 py-2 text-sm font-semibold text-white transition hover:bg-primary-800"
              (click)="confirmAction()">
        {{ confirm.state().confirmText }}
      </button>
    </div>
  </div>
</div>
