<div class="p-6">
  <div class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h1 class="text-3xl font-semibold text-slate-900">{{ pageTitle }}</h1>
      <p class="mt-2 text-sm text-slate-500">Fill in invoice details, then save to return to the invoice list.</p>
    </div>
    <button routerLink="/create-invoice" class="inline-flex items-center rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50">
      Back to Invoice List
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-8 rounded-[2rem] border border-gray-200 bg-white p-8 shadow-xl shadow-slate-200/40">
    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Invoice details</p>
      </div>
      <div class="grid gap-6 md:grid-cols-2">
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Customer</span>
          <input formControlName="customer" type="text" placeholder="Customer name" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Amount</span>
          <input formControlName="amount" type="text" placeholder="$0.00" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Due Date</span>
          <input formControlName="dueDate" type="date" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Status</span>
          <select formControlName="status" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100">
            <option value="Due">Due</option>
            <option value="Paid">Paid</option>
            <option value="Overdue">Overdue</option>
          </select>
        </label>
      </div>
    </div>

    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Notes</p>
      </div>
      <label class="space-y-3">
        <span class="text-sm font-medium text-slate-700">Invoice notes</span>
        <textarea formControlName="notes" rows="5" placeholder="Optional notes" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100"></textarea>
      </label>
    </div>

    <div class="flex flex-col gap-3 border-t border-gray-200 pt-4 sm:flex-row sm:justify-end">
      <button type="button" (click)="cancel()" class="rounded-2xl border border-gray-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
        Cancel
      </button>
      <button type="submit" class="rounded-2xl bg-primary-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-primary-200/30 transition hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60" [disabled]="form.invalid">
        {{ submitText }}
      </button>
    </div>
  </form>
</div>
