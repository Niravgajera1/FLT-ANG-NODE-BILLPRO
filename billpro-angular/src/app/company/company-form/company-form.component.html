<div class="p-6">
  <div class="mb-6 flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
    <div>
      <h1 class="text-3xl font-semibold text-slate-900">{{ pageTitle }}</h1>
      <p class="mt-2 text-sm text-slate-500">Complete the customer details and save to return to the customer list.</p>
    </div>
    <button routerLink="/customer" class="inline-flex items-center rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-50">
      Back to Customer List
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-8 rounded-[2rem] border border-gray-200 bg-white p-8 shadow-xl shadow-slate-200/40">
    <div *ngIf="form.invalid && form.touched" class="validation-message">
      Please fill all required fields before saving.
    </div>
    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Customer Information</p>
      </div>
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Customer Name</span>
          <input formControlName="name" type="text" placeholder="Global Tech Distribution Pvt Ltd" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Display Name</span>
          <input formControlName="displayName" type="text" placeholder="Global Tech" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Customer Type</span>
          <select formControlName="customerType" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100">
            <option value="B2B">B2B</option>
            <option value="B2C">B2C</option>
          </select>
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Customer Group</span>
          <input formControlName="customerGroup" type="text" placeholder="Wholesale Distributors" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
      </div>
    </div>

    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Tax & Contact</p>
      </div>
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">GSTIN</span>
          <input formControlName="gstin" type="text" placeholder="27AAACG1234D1Z5" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">PAN</span>
          <input formControlName="pan" type="text" placeholder="AAACG1234D" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="flex items-center gap-3 text-sm text-slate-700">
          <input type="checkbox" formControlName="isGSTRegistered" class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
          GST registered
        </label>
        <label class="flex items-center gap-3 text-sm text-slate-700">
          <input type="checkbox" formControlName="isActive" class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
          Active customer
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Contact Person</span>
          <input formControlName="contactPerson" type="text" placeholder="Rajesh Kumar" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Mobile</span>
          <input formControlName="mobile" type="tel" placeholder="9876543210" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Email</span>
          <input formControlName="email" type="email" placeholder="billing@globaltech.com" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Alternate Mobile</span>
          <input formControlName="altMobile" type="tel" placeholder="02225001234" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Website</span>
          <input formControlName="website" type="url" placeholder="https://www.globaltech.com" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
      </div>
    </div>

    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6 flex items-center justify-between">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Addresses</p>
        <button type="button" (click)="addAddress()" class="rounded-2xl border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
          Add Address
        </button>
      </div>
      <div formArrayName="addresses" class="space-y-6">
        <div *ngFor="let address of addresses.controls; let i = index" [formGroupName]="i" class="rounded-2xl border border-slate-200 bg-white p-5">
          <div class="mb-4 flex items-center justify-between gap-3">
            <p class="text-sm font-semibold text-slate-900">Address {{ i + 1 }}</p>
            <button type="button" (click)="removeAddress(i)" class="rounded-2xl border border-red-200 bg-red-50 px-3 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-100">
              Remove
            </button>
          </div>
          <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
            <label class="space-y-3">
              <span class="text-sm font-medium text-slate-700">Label</span>
              <input formControlName="label" type="text" placeholder="Billing Address" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
            </label>
            <label class="flex items-center gap-3 text-sm text-slate-700">
              <input type="checkbox" formControlName="isDefault" class="h-4 w-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500" />
              Default address
            </label>
            <label class="space-y-3">
              <span class="text-sm font-medium text-slate-700">Address Line 1</span>
              <input formControlName="line1" type="text" placeholder="404, Business Plaza, Sector 11" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
            </label>
            <label class="space-y-3">
              <span class="text-sm font-medium text-slate-700">Address Line 2</span>
              <input formControlName="line2" type="text" placeholder="CBD Belapur" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
            </label>
            <label class="space-y-3">
              <span class="text-sm font-medium text-slate-700">City</span>
              <input formControlName="city" type="text" placeholder="Navi Mumbai" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
            </label>
            <div class="space-y-3">
              <span class="text-sm font-medium text-slate-700">State Code</span>
              <div class="relative">
                <button
                  type="button"
                  class="flex w-full items-center justify-between rounded-2xl border border-gray-200 bg-white px-4 py-3 text-left text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100"
                  [class.text-slate-400]="!address.get('stateCode')?.value"
                  (click)="toggleStateCodeDropdown(i)"
                >
                  <span>{{ selectedStateCodeLabel(i) }}</span>
                  <span class="text-slate-400">v</span>
                </button>
                <div
                  *ngIf="stateCodeDropdownIndex() === i"
                  class="absolute z-20 mt-2 w-full overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-lg"
                >
                  <div class="border-b border-slate-100 p-2">
                    <input
                      type="text"
                      placeholder="Search state"
                      [value]="stateCodeSearch()"
                      (input)="stateCodeSearch.set($any($event.target).value)"
                      class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100"
                      autocomplete="off"
                    />
                  </div>
                  <div class="max-h-64 overflow-y-auto py-1">
                    <button
                      *ngFor="let stateOption of filteredStateOptions()"
                      type="button"
                      class="flex w-full px-4 py-2 text-left text-sm text-slate-700 hover:bg-primary-50 hover:text-primary-700"
                      [class.bg-primary-50]="address.get('stateCode')?.value === stateOption.code"
                      [class.text-primary-700]="address.get('stateCode')?.value === stateOption.code"
                      (click)="selectStateCode(i, stateOption)"
                    >
                      {{ stateOption.name }} - {{ stateOption.code }}
                    </button>
                    <div *ngIf="filteredStateOptions().length === 0" class="px-4 py-3 text-sm text-slate-500">
                      No states found.
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <label class="space-y-3">
              <span class="text-sm font-medium text-slate-700">PIN Code</span>
              <input formControlName="pinCode" type="text" placeholder="400614" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
            </label>
            <label class="space-y-3">
              <span class="text-sm font-medium text-slate-700">Country</span>
              <input formControlName="country" type="text" placeholder="India" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="rounded-3xl bg-slate-50 p-6">
      <div class="mb-6">
        <p class="text-sm font-semibold uppercase tracking-[0.24em] text-slate-500">Commercial Details</p>
      </div>
      <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Payment Terms</span>
          <input formControlName="paymentTerms" type="text" placeholder="Net 30" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Credit Limit</span>
          <input formControlName="creditLimit" type="number" min="0" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Opening Balance</span>
          <input formControlName="openingBalance" type="number" min="0" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Opening Balance Date</span>
          <input formControlName="openingBalanceDate" type="date" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Discount Percent</span>
          <input formControlName="discountPercent" type="number" min="0" max="100" step="0.01" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3">
          <span class="text-sm font-medium text-slate-700">Tags</span>
          <input formControlName="tags" type="text" placeholder="vip, high-volume, tech" class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100" />
        </label>
        <label class="space-y-3 md:col-span-2 lg:col-span-3">
          <span class="text-sm font-medium text-slate-700">Notes</span>
          <textarea formControlName="notes" rows="4" placeholder="Preferred distributor. Deliver shipping address orders strictly on weekdays." class="w-full rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-100"></textarea>
        </label>
      </div>
    </div>

    <div class="flex flex-col gap-3 border-t border-gray-200 pt-4 sm:flex-row sm:justify-end">
      <button type="button" (click)="cancel()" class="rounded-2xl border border-gray-200 bg-white px-6 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
        Cancel
      </button>
      <button type="submit" class="rounded-2xl bg-primary-600 px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-primary-200/30 transition hover:bg-primary-700 disabled:cursor-not-allowed disabled:opacity-60" [disabled]="form.invalid || isSaving() || isLoading()">
        {{ isSaving() ? 'Saving...' : (isLoading() ? 'Loading...' : submitText) }}
      </button>
    </div>
  </form>
</div>
